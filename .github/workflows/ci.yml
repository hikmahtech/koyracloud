name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: arshadansari27/koyracloud

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Control-plane tests
        working-directory: control-plane
        run: uv run --with-editable . --with pytest pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build UI
        working-directory: web
        run: npm ci && npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Ruff
        working-directory: control-plane
        run: uvx ruff@0.15.16 check .

  # Push only: the image tag is the only hand-off. homelab-gitops rolls
  # koyracloud_control-plane to main's tag from its own runner
  # (.github/workflows/deploy-koyracloud.yml there). This repo is public, so it
  # gets no self-hosted runner and no secret that reaches the swarm.
  build:
    name: Build & Push
    needs: [backend, web, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: control-plane/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bakes the GA4 gtag into index.html at build time. Unset secret =>
          # empty => no analytics tag (the self-host-friendly default).
          build-args: |
            KOYRA_GA_MEASUREMENT_ID=${{ secrets.KOYRA_GA_MEASUREMENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
